# Render Blueprint — despliegue gratuito de CosTamarindo (juego + API + Supabase).
# Render lee este archivo al conectar el repo y crea el servicio solo.

services:
  - type: web
    name: costamarindo
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: deploy/render/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        sync: false   # dev para probar rápido con Supabase DEV; prod para producción
      - key: LOG_LEVEL
        value: INFO
      - key: OLLAMA_URL
        value: http://127.0.0.1:9   # Ollama no corre en Render; el NPC usa respaldo
      - key: CORS_ALLOWED_ORIGINS
        value: https://costamarindo.onrender.com
      - key: DEV_PROJECT_REFS
        value: jukyiwsteuzwrmzlgfme
      # Secretos: sync=false => se cargan en el dashboard de Render, nunca aquí.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: BACKEND_JWT_SECRET
        sync: false
      - key: PIN_PEPPER
        sync: false
      - key: SESSION_MASTER_KEY
        sync: false
