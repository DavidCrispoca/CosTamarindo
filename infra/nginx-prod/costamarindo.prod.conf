# Sg-Frontend · sitio de producción (dominio real + Let's Encrypt)
#
# Sustituye a infra/nginx/conf.d/costamarindo.conf cuando se despliega con
# docker-compose.prod.yml. Reemplaza __DOMAIN__ por el dominio real:
#   sed -i 's/__DOMAIN__/tudominio.com/g' infra/nginx-prod/costamarindo.prod.conf
#
# Certificados: se montan en /etc/nginx/certs/fullchain.pem y privkey.pem
# (copiados de /etc/letsencrypt/live/<dominio>/).

map $uri $build_cache_control {
    default                          "public, max-age=604800";
    ~*^/Build/                       "public, max-age=31536000, immutable";
    ~*index\.html$                   "no-cache";
}

# HTTP → HTTPS (también sirve el desafío ACME si se usa webroot).
server {
    listen      80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    http2       on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root  /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* ^/Build/.+\.wasm\.gz$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip off;
        default_type application/wasm;
        add_header Content-Encoding gzip always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location ~* ^/Build/.+\.js\.gz$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip off;
        default_type application/javascript;
        add_header Content-Encoding gzip always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location ~* ^/Build/.+\.gz$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding gzip always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location /Build/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location /TemplateData/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        limit_req zone=api burst=20 nodelay;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://sg-backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Request-Id       $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri $uri/ /index.html;
    }
}
