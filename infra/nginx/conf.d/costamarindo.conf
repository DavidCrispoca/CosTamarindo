# Sg-Frontend · sitio del juego + proxy /api/ hacia Sg-Backend
#
# Build WebGL montado en /usr/share/nginx/html (builds/webgl).
# Certificados mkcert en /etc/nginx/certs (juego.local).

# El nombre del backend se resuelve por DNS de Docker en cada petición:
# si el contenedor está caído, Nginx arranca igual y devuelve 502 en /api/.
resolver 127.0.0.11 valid=10s ipv6=off;

# Unity exporta el build comprimido en gzip y el loader pide los `.gz` directo.
# El Content-Type debe ser el del archivo ORIGINAL, no `application/gzip`.
map $uri $build_cache_control {
    default                          "public, max-age=604800";
    ~*^/Build/                       "public, max-age=31536000, immutable";
    ~*index\.html$                   "no-cache";
}

server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Healthcheck del contenedor.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # wasm precomprimido (Unity 6: Build/webgl.wasm.gz)
    location ~* ^/Build/.+\.wasm\.gz$ {
        include /etc/nginx/snippets/security-headers.conf;
        gzip off;
        default_type application/wasm;
        add_header Content-Encoding gzip always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    # framework.js precomprimido
    location ~* ^/Build/.+\.js\.gz$ {
        include /etc/nginx/snippets/security-headers.conf;
        gzip off;
        default_type application/javascript;
        add_header Content-Encoding gzip always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    # data / resto de artefactos precomprimidos
    location ~* ^/Build/.+\.gz$ {
        include /etc/nginx/snippets/security-headers.conf;
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding gzip always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location /Build/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location /TemplateData/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    # API: rate limit en el borde + proxy al contenedor privado.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=20 nodelay;

        set $backend http://sg-backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Request-Id       $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $build_cache_control always;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen      443 ssl;
    http2       on;
    server_name juego.local;

    ssl_certificate     /etc/nginx/certs/juego.local.pem;
    ssl_certificate_key /etc/nginx/certs/juego.local-key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root  /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* ^/Build/.+\.wasm\.gz$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip off;
        default_type application/wasm;
        add_header Content-Encoding gzip always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location ~* ^/Build/.+\.js\.gz$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip off;
        default_type application/javascript;
        add_header Content-Encoding gzip always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location ~* ^/Build/.+\.gz$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        gzip off;
        default_type application/octet-stream;
        add_header Content-Encoding gzip always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location /Build/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location /TemplateData/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri =404;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        limit_req zone=api burst=20 nodelay;

        set $backend http://sg-backend:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Request-Id       $request_id;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control $build_cache_control always;
        try_files $uri $uri/ /index.html;
    }
}
