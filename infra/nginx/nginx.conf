# Sg-Frontend · Nginx
# Sirve el build WebGL de Unity y hace de proxy hacia Sg-Backend.
# Contexto http: se incluye desde el Dockerfile del contenedor frontend.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs en JSON: los consume Wazuh (A.8.15) sin parseos frágiles.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$request_id",'
        '"request_time":$request_time'
    '}';

    access_log  /var/log/nginx/access.log json;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 1m;

    # Rate limit del API (A.820/A.8.5). El backend refuerza por usuario.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # Compresión en caliente solo para lo que NO viene precomprimido del build.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
