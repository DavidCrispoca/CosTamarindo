# Cabeceras comunes. Se incluye en cada location que declare sus propios
# add_header, porque nginx no hereda los del servidor si el bloque hijo ya
# define alguno.
add_header X-Content-Type-Options   "nosniff" always;
add_header X-Frame-Options          "DENY" always;
add_header Referrer-Policy          "no-referrer" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# La CSP vive en csp.conf porque el hash del <script> inline de Unity cambia
# en cada build. Se regenera con: node tools/dev-server/csp.mjs ...
include /etc/nginx/snippets/csp.conf;
