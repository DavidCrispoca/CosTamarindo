<!--
  Configuracion centralizada del grupo Wazuh `game`.
  Se instala en el manager como /var/ossec/etc/shared/game/agent.conf.

  El agente corre en el host del juego (contenedor sg-wazuh-agent) y monta:
    /var/log/costamarindo/backend.log  <- backend (JSON)
    /var/log/nginx/access.log          <- Nginx (JSON)
    /fim/webgl                         <- webroot de solo lectura
-->
<agent_config>

  <!-- A.8.15: eventos de negocio y seguridad del backend. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/costamarindo/backend.log</location>
  </localfile>

  <!-- A.8.15 / A.8.20: access log JSON de Nginx. -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <!-- A.8.19: integridad del build WebGL.
       Docker Desktop monta el webroot como v9fs: inotify/realtime no es
       fiable ahi, por eso se usa un escaneo programado cada 5 minutos. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <!-- Docker Desktop monta el webroot como v9fs; sin esto syscheck lo
         trata como NFS y no lo escanea. -->
    <skip_nfs>no</skip_nfs>
    <directories check_all="yes" report_changes="yes">/fim/webgl</directories>
  </syscheck>

</agent_config>
