# Nginx para Render: sirve el build WebGL y proxifica /api/ a uvicorn (127.0.0.1:8000).
# Render termina TLS; aquí escuchamos HTTP en el puerto __PORT__ (lo sustituye start.sh).
# Sustituye /etc/nginx/nginx.conf en la imagen de Render.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip off;   # el build ya viene precomprimido (.gz)
    server_tokens off;   # no revelar la versión de nginx (H-02)

    map $uri $build_cache_control {
        default                          "public, max-age=604800";
        ~*^/Build/                       "public, max-age=31536000, immutable";
        ~*index\.html$                   "no-cache";
        ~*^/$                            "no-cache";
    }

    server {
        listen __PORT__;
        server_name _;

        root /webgl;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # wasm precomprimido (Unity 6: Build/*.wasm.gz)
        location ~* ^/Build/.+\.wasm\.gz$ {
            include /etc/nginx/snippets/security-headers.conf;
            gzip off;
            default_type application/wasm;
            add_header Content-Encoding gzip always;
            add_header Cache-Control $build_cache_control always;
            try_files $uri =404;
        }

        # framework.js precomprimido
        location ~* ^/Build/.+\.js\.gz$ {
            include /etc/nginx/snippets/security-headers.conf;
            gzip off;
            default_type application/javascript;
            add_header Content-Encoding gzip always;
            add_header Cache-Control $build_cache_control always;
            try_files $uri =404;
        }

        # data / resto de artefactos precomprimidos
        location ~* ^/Build/.+\.gz$ {
            include /etc/nginx/snippets/security-headers.conf;
            gzip off;
            default_type application/octet-stream;
            add_header Content-Encoding gzip always;
            add_header Cache-Control $build_cache_control always;
            try_files $uri =404;
        }

        location /Build/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control $build_cache_control always;
            try_files $uri =404;
        }

        location /TemplateData/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control $build_cache_control always;
            try_files $uri =404;
        }

        location /api/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control $build_cache_control always;
            try_files $uri $uri/ =404;
        }
    }
}
