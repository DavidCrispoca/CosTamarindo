name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escanear secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Tests y dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias de prueba
        run: pip install -r backend/requirements-dev.txt pip-audit

      - name: Tests del backend
        working-directory: backend
        run: pytest -q

      - name: Auditar dependencias de ejecucion
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Validar Compose
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml config --quiet
